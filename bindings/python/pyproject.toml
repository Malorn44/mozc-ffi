[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mozc-ffi"
version = "0.1.0"
description = "Unofficial Python bindings for Google's Mozc kana-kanji converter, in process"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["mozc_ffi"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mozc-ffi"
version = "0.2.0"
description = "Unofficial Python bindings for Google's Mozc kana-kanji converter, in process"
license = "BSD-3-Clause"
keywords = ["japanese", "mozc", "ime", "kana-kanji"]
requires-python = ">=3.11"

[project.urls]
Documentation = "https://mozc-ffi.readthedocs.io/stable/python/"
Repository = "https://github.com/Malorn44/mozc-ffi"
Changelog = "https://github.com/Malorn44/mozc-ffi/blob/main/CHANGELOG.md"
Issues = "https://github.com/Malorn44/mozc-ffi/issues"

[tool.setuptools]
packages = ["mozc_ffi"]

[tool.setuptools.package-data]
# py.typed, and the native library and the notices, which scripts/package.sh places in the package
# for each wheel.
mozc_ffi = ["py.typed", "*.so", "*.dll", "*.dylib", "*.md"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear and ruff's own checks, as in polykey.
select = ["E", "F", "W", "B", "RUF"]

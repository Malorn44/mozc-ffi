# Lints, builds and tests on every pull request and every push to main. Each platform's tests wait
# only for that platform's build. "ci ok" is the one check the main ruleset requires: it passes only
# when every other job passed (pr-title is skipped off pull requests).
#
# The lint and test steps run scripts/check.sh, the same commands as a local run. The builds'
# steps live in .github/actions/, shared with the release jobs at the end (.github/RELEASING.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (${{ matrix.check }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [c, python, csharp, rust, node, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.check == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - if: matrix.check == 'rust'
        run: rustup component add rustfmt clippy
      - run: scripts/check.sh lint "$CHECK"
        env:
          CHECK: ${{ matrix.check }}

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash-merged: the title becomes the commit on main, so it is a conventional commit.
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The PR title is not a conventional commit, type(scope): summary"
            exit 1
          fi
          echo "PR title ok"

  build-linux:
    runs-on: ubuntu-24.04
    # glibc 2.28, so the library loads on any Linux with glibc 2.28 or later (manylinux_2_28 wheels).
    container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.25-1@sha256:e2808351a165aa85913d79f1f8457b4f6d74047b47fba07b5b9a5e6c0055a017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-linux
        with:
          artifact: lib-linux-x64

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-windows
        with:
          artifact: lib-windows-x64

  test-linux:
    name: test-linux (${{ matrix.binding }}${{ matrix.version && format(' {0}', matrix.version) || '' }})
    needs: build-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version of each language, and the newest.
        include:
          - binding: c
          - binding: csharp
          - { binding: python, version: "3.11" }
          - { binding: python, version: "3.x" }
          - { binding: node, version: "22" }
          - { binding: node, version: "lts/*" }
          - { binding: rust, version: "1.88" }
          - { binding: rust, version: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib-linux-x64
          path: build
      - if: matrix.binding == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.version }}
      - if: matrix.binding == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
      - if: matrix.binding == 'rust'
        run: |
          rustup toolchain install "$VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$VERSION" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ matrix.version }}
      - run: scripts/check.sh test "$BINDING"
        env:
          BINDING: ${{ matrix.binding }}

  test-windows:
    name: test-windows (${{ matrix.binding }})
    needs: build-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        binding: [c, csharp, python, node, rust] # the newest version of each
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib-windows-x64
          path: build
      - if: matrix.binding == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - if: matrix.binding == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: scripts/check.sh test "$BINDING"
        env:
          BINDING: ${{ matrix.binding }}

  ci-ok:
    name: ci ok # the name the main ruleset requires
    needs: [lint, pr-title, build-linux, build-windows, test-linux, test-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Skipped is fine (pr-title, off pull requests); failed or cancelled is not.
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null

  # release-please (.github/release-please/) opens the release PR and, once it merges, tags the release
  # and drafts it on GitHub. It acts with RELEASE_PLEASE_TOKEN, a fine-grained token for this repo, so
  # CI runs on the release PR: what the Actions token does starts no workflow. The token is a secret of
  # the release-please environment, which only main may use.
  #
  # The jobs after this one build the commit release-please tagged, never the tag by name (a tag can be
  # moved), and only once this job has found it on main.
  release:
    name: release
    needs: ci-ok # after every check, so a red main never releases
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: release-please # holds RELEASE_PLEASE_TOKEN; deployment branches: main only, no reviewer
    permissions:
      contents: read # see whether main has moved on, and check out its history
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
      sha: ${{ steps.on-main.outputs.sha }}
    steps:
      # A secret can't be read in `if:`, so a step says whether it is set. Until it is, this job (and
      # every release job after it) skips rather than turn main red.
      - name: release-please token
        id: token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No RELEASE_PLEASE_TOKEN secret in the release-please environment, so release-please did not run (.github/RELEASING.md)."
          fi
      # release-please reads main as it is now, not this run's commit. Once main has moved on, it runs
      # in the newer commit's run instead (queued behind this one), so what it tags is on main here.
      - name: main is still at this commit
        id: head
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head, so release-please runs in that commit's run, not this one"
          fi
      - id: release-please
        if: steps.head.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
      - if: steps.release-please.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, for the check below
          persist-credentials: false
      - name: the release is on main
        id: on-main
        if: steps.release-please.outputs.release_created == 'true'
        env:
          SHA: ${{ steps.release-please.outputs.sha }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
        run: |
          if [[ ! $SHA =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"; then
            echo "::error::release-please tagged $TAG at ${SHA:-no commit}, which is not on main at $GITHUB_SHA, so nothing is built (.github/RELEASING.md)"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$TAG is $SHA, on main"

  # The release's own commit, built with the same steps as CI (usually this run's commit, from cache).
  release-build-linux:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.25-1@sha256:e2808351a165aa85913d79f1f8457b4f6d74047b47fba07b5b9a5e6c0055a017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-linux
        with:
          artifact: release-linux-x64

  release-build-windows:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.created == 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-windows
        with:
          artifact: release-windows-x64

  # Packs the archives and the packages, records build provenance for all of them, attaches the
  # archives to the draft release, and hands the packages to the publish jobs.
  release-assets:
    needs: [release, release-build-linux, release-build-windows]
    if: ${{ !cancelled() && needs.release.outputs.created == 'true' && needs.release-build-linux.result == 'success' && needs.release-build-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to the draft release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x64
          path: build/release/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-x64
          path: build/release/windows-x64
      - run: scripts/package.sh "$VERSION" build/release/linux-x64 build/release/windows-x64 build/dist
        env:
          VERSION: ${{ needs.release.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/dist/mozc-ffi-*
            build/dist/python/*
            build/dist/nuget/*
            build/dist/npm/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            build/dist/SHA256SUMS
            build/dist/python
            build/dist/nuget
            build/dist/npm
          if-no-files-found: error
      - name: Attach the archives to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" build/dist/mozc-ffi-* build/dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # The registries, each through trusted publishing: no stored token, the registry trusts this
  # workflow in the release environment, which waits for Mara's approval. npm and crates.io can only
  # trust a package that exists, so their first version is published by hand (.github/RELEASING.md)
  # and their jobs skip until the NPM_TRUSTED and CRATES_TRUSTED variables are "true".
  publish-pypi:
    needs: [release, release-assets]
    if: ${{ !cancelled() && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/python
          skip-existing: true # a re-run after a partial publish

  publish-nuget:
    needs: [release, release-assets]
    if: ${{ !cancelled() && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "dist/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  publish-npm:
    needs: [release, release-assets]
    if: ${{ !cancelled() && needs.release-assets.result == 'success' && vars.NPM_TRUSTED == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing, which also adds npm's provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11 # trusted publishing needs npm 11.5.1 or later
      # The platform packages first, so the bindings never point at a version that isn't there yet.
      # A version already on npm (a re-run after a partial publish) is skipped.
      - run: |
          for package in dist/npm/mozc-ffi-linux-x64-*.tgz dist/npm/mozc-ffi-win32-x64-*.tgz dist/npm/mozc-ffi-[0-9]*.tgz; do
            spec=$(tar -xzOf "$package" package/package.json | jq -r '.name + "@" + .version')
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish "$package" --access public
            fi
          done

  publish-crate:
    needs: [release, release-assets]
    if: ${{ !cancelled() && needs.release-assets.result == 'success' && vars.CRATES_TRUSTED == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      # The crate carries the archives' checksums, which its download feature checks against.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - run: cp dist/SHA256SUMS bindings/rust/SHA256SUMS
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # A version already on crates.io (a re-run after a partial publish) is skipped.
          if curl -fsS -o /dev/null -A "mozc-ffi release (github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/mozc-ffi/$VERSION"; then
            echo "mozc-ffi $VERSION is already on crates.io"
          else
            cargo publish --manifest-path bindings/rust/Cargo.toml --allow-dirty # SHA256SUMS is not in git
          fi

  # Once every registry has the release (npm and crates.io may be skipped), the draft goes public.
  release-publish:
    needs: [release, publish-pypi, publish-nuget, publish-npm, publish-crate]
    if: >-
      ${{ !cancelled() && needs.publish-pypi.result == 'success' && needs.publish-nuget.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.publish-npm.result)
      && contains(fromJSON('["success", "skipped"]'), needs.publish-crate.result) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the draft release
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
